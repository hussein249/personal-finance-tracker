{% extends "base.html" %}
{% block title %}Register · Finance Tracker{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto rounded-2xl border border-slate-800 bg-slate-900 p-6 mt-12">
  <h1 class="text-2xl font-semibold mb-6 text-center">Create Account</h1>
  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="block text-sm">
      <span class="mb-1 block text-slate-300">Username</span>
      <input name="username" required autofocus
             class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100" />
    </label>
    <label class="block text-sm">
      <span class="mb-1 block text-slate-300">Email</span>
      <input name="email" type="email" required
             class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100" />
    </label>
    <label class="block text-sm">
      <span class="mb-1 block text-slate-300">Password</span>
      <input name="password" type="password" required minlength="8"
             class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100" />
      <span class="text-xs text-slate-500">At least 8 characters.</span>
    </label>
    <label class="block text-sm">
      <span class="mb-1 block text-slate-300">Confirm Password</span>
      <input name="confirm_password" type="password" required minlength="8"
             class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100" />
    </label>
    <button type="submit"
      class="w-full rounded-xl bg-brand/20 hover:bg-brand/30 text-brand px-4 py-2 border border-brand/30">
      Register
    </button>
  </form>
  <p class="text-sm text-slate-400 mt-4 text-center">
    Already have an account? <a href="{{ url_for('login') }}" class="text-brand hover:underline">Log in</a>
  </p>
</div>
{% endblock %}
