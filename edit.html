{% extends "base.html" %}
{% block title %}Edit Transaction · Finance Tracker{% endblock %}
{% block content %}
  <h1 class="text-3xl font-semibold mb-2">Edit Transaction</h1>
  <p class="text-slate-400 mb-6">Update the fields and save your changes.</p>

  <section class="max-w-xl rounded-2xl border border-slate-800 bg-slate-900 p-4">
    <form method="post" action="{{ url_for('edit_post', tx_id=tx.id) }}" class="space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="grid grid-cols-2 gap-2 text-sm">
        <label class="flex items-center gap-2">
          <input type="radio" name="type" value="expense" {% if tx.type == 'expense' %}checked{% endif %}
                 onchange="updateCategoryOptions()"> Expense
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" name="type" value="income" {% if tx.type == 'income' %}checked{% endif %}
                 onchange="updateCategoryOptions()"> Income
        </label>
      </div>

      <label class="block text-sm">
        <span class="mb-1 block text-slate-300">Description</span>
        <input name="description" value="{{ tx.description }}" required
               class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100" />
      </label>

      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm">
          <span class="mb-1 block text-slate-300">Amount</span>
          <input type="number" step="0.01" min="0.01" name="amount"
                 value="{{ '%.2f'|format(tx.amount) }}" required
                 class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100" />
        </label>
        <label class="block text-sm">
          <span class="mb-1 block text-slate-300">Date</span>
          <input type="date" name="date"
                 value="{{ tx.date.strftime('%Y-%m-%d') if tx.date else today }}"
                 class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100" />
        </label>
      </div>

      <label class="block text-sm">
        <span class="mb-1 block text-slate-300">Category</span>
        <select name="category" id="categorySelect"
                class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-slate-100">
          {% set cats = income_categories if tx.type == 'income' else expense_categories %}
          {% for c in cats %}
            <option value="{{ c }}" {% if tx.category == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </label>

      <div class="flex items-center gap-2">
        <button class="rounded-xl bg-brand/20 hover:bg-brand/30 text-brand px-4 py-2 border border-brand/30"
                type="submit">Save Changes</button>
        <a class="rounded-xl bg-slate-800 hover:bg-slate-700 px-4 py-2 border border-slate-700"
           href="{{ url_for('index') }}">Cancel</a>
      </div>
    </form>
  </section>

  <script>
    const expenseCats = {{ expense_categories | tojson }};
    const incomeCats = {{ income_categories | tojson }};

    function updateCategoryOptions() {
      const type = document.querySelector('input[name="type"]:checked').value;
      const select = document.getElementById('categorySelect');
      const cats = type === 'income' ? incomeCats : expenseCats;
      select.innerHTML = '';
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    }
  </script>
{% endblock %}
